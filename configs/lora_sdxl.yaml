model:
  name: "stabilityai/stable-diffusion-xl-base-1.0"
  revision: "main"

lora:
  rank: 64
  alpha: 64
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"
    - "proj_in"
    - "proj_out"
    - "ff.net.0.proj"
    - "ff.net.2"
  dropout: 0.1

training:
  output_dir: "./output/lora_sdxl"
  resolution: 1024
  train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1e-4
  lr_scheduler: "cosine"
  lr_warmup_steps: 100
  max_train_steps: 5000
  checkpointing_steps: 500
  seed: 42
  mixed_precision: "fp16"
  gradient_checkpointing: true
  snr_gamma: 5.0

data:
  dataset_dir: "./data/training_images"
  caption_column: "text"
  image_column: "image"
  resolution: 1024
  center_crop: true
  random_flip: true

hardware:
  enable_xformers: false
  allow_tf32: false
